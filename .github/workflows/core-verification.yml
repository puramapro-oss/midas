name: MIDAS Core Verification
on:
  push:
    branches: [main]
  # Stacked pull requests target audit/repair branches as well as main.
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # These tests use only Node built-ins; a private dependency must not stop
      # the independent core checks. The Playwright job remains mandatory work.
      - run: node --test scripts/bootstrap-shared-packages.test.mjs scripts/install-private-dependencies.test.mjs
      - run: npm run test:unit
      - name: Verify status, deployment evidence and shared-risk contracts without providers
        run: >-
          node --experimental-vm-modules --experimental-strip-types --test
          scripts/status-contract.test.mjs
          scripts/qualify-ovh.test.mjs
          tests/shared-account-risk/adapter.test.mjs
      - run: node scripts/check-niyama-decisions.mjs
  shared-account-risk:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install the locked private PostgreSQL test runtime
        run: npm ci --prefix tests/shared-account-risk/runtime --ignore-scripts --no-audit --no-fund
      - name: Restore the locked PostgreSQL package's local library links
        run: node tests/shared-account-risk/runtime/node_modules/@embedded-postgres/linux-x64/scripts/hydrate-symlinks.js
      - name: Exercise the complete shared-account contract on a disposable cluster
        run: npm run test:shared-risk:postgres
      - name: Preserve native contract and cleanup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shared-account-risk-native
          path: test-results/shared-account-risk/
          if-no-files-found: error
          retention-days: 7
  paper-transactions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix tests/paper --ignore-scripts --no-audit --fund=false
      - run: npm test --prefix tests/paper
  postgres-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: midas_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d midas_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix tests/paper --ignore-scripts --no-audit --fund=false
      - run: npm run test:postgres --prefix tests/paper
        env:
          TEST_DATABASE_URL: postgres://postgres:local-ci-only@localhost:5432/midas_ci
          MIDAS_TEST_DATABASE_IS_DISPOSABLE: 'true'
